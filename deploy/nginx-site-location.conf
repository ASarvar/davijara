# The davijara.uz blocks for `markaz` (192.168.1.248) — the machine that
# actually runs the Next.js service. This is the INNER of two nginx hops; the
# outer one lives on `markazsrv` and has its own, different file — see
# deploy/nginx-edge-site-location.conf. Confirm with `hostname` before
# editing: this file's proxy_pass is wrong for the other box.
#
# NOT a standalone site config — this server's davijara.uz vhost is shared
# with other projects (/kadastr, /api/search and the PHP handler all belong to
# something else, and must be left in place). Merge these blocks into the
# existing vhost, then:
#   nginx -t && systemctl reload nginx
#
# Pairs with an EMPTY NEXT_PUBLIC_BASE_PATH. Both must agree — see the note in
# next.config.ts for what breaks if they don't.

# ─────────────────────────────────────────────────────────────────────────────
# The site used to live at /site and now serves the root. Two things follow.
# ─────────────────────────────────────────────────────────────────────────────

# 1. DELETE the old front-door redirect if it is still there:
#
#        location = / { return 301 /site; }
#
#    Left in place it bounces the domain root straight back to a path that no
#    longer exists, which is a redirect loop into a 404.

# 2. Keep the old URLs working. The site was public at /site, so those paths
#    are in search indexes, in citizens' bookmarks and in other agencies'
#    links. 301 means the address bar and the index both get corrected.
#
#    `location ^~ /site` WITHOUT the trailing slash would be a bug: the prefix
#    also matches /sitemap.xml, and the site's own sitemap would 301 into
#    /map.xml. The exact-match block covers the bare /site that the prefix
#    block with the slash cannot see.
location = /site { return 301 /; }
location ^~ /site/ {
    # Relative Location on purpose. This hop is plain HTTP behind the edge, so
    # $scheme is "http" here — building an absolute URL from it would downgrade
    # every redirected visitor out of TLS. A relative target keeps the
    # browser's own scheme and host.
    rewrite ^/site/(.*)$ /$1 permanent;
}

location / {
    # No trailing slash and no URI part on proxy_pass, deliberately: nginx then
    # forwards the ORIGINAL path unchanged, which is what Next expects now that
    # it runs with an empty basePath and matches on the real public path.
    #
    # [::1], not 127.0.0.1 — IPv6 loopback, and that is not a preference.
    #
    # The unit must bind with HOSTNAME=localhost so Next's rewrite-origin check
    # passes (see the long note in deploy/davijara.service). On this box Node
    # resolves `localhost` to ::1, so the server listens on IPv6 loopback ONLY
    # and an IPv4 proxy_pass gets connection-refused. Confirmed with:
    #     ss -ltnp | grep 3001
    #     LISTEN 0 128 [::1]:3001 [::]:*  users:(("next-server (v1",pid=...))
    #
    # Forcing IPv4 with NODE_OPTIONS=--dns-result-order=ipv4first was tried and
    # does NOT move the listener — verified, it still bound IPv6 only. So the
    # proxy follows the app rather than the other way round.
    #
    # Still loopback, so nothing is exposed beyond this host. Re-check the `ss`
    # output above if HOSTNAME or the Node version ever changes.
    proxy_pass http://[::1]:3001;
    proxy_http_version 1.1;

    # Next.js dev/HMR and any future websocket use.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # TLS is terminated by the edge; this is how the app knows the public scheme.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Image uploads in the admin panel.
    #
    # ⚠ nginx's default is 1 MB, and it rejects anything larger with a bare
    # 413 BEFORE the request reaches Next.js — so the app never sees it and
    # cannot produce a useful message. The editor gets an nginx error page.
    #
    # 8m leaves headroom over the app's own limits (5 MB per file,
    # serverActions.bodySizeLimit 6mb in next.config.ts) so that an
    # oversized file is refused by THIS project's code, with an explanation
    # in Uzbek, rather than by the proxy. Raising the app limits means
    # raising this one first.
    #
    # The edge server has its own copy of this directive; both hops enforce
    # it independently, so setting it here alone is not enough.
    client_max_body_size 8m;

    proxy_cache_bypass $http_upgrade;
}

# ─────────────────────────────────────────────────────────────────────────────
# LEAVE THESE ALONE — they belong to other projects on this shared vhost and
# they still work, because nginx picks the most specific location rather than
# the first one written:
#
#   location ~ \.php$        regex, evaluated BEFORE the prefix `location /`
#   location /kadastr        longer prefix than `/`, so it wins
#   location /api/search     longer prefix than `/`, so it wins — note this
#                            proxies to an EXTERNAL host, otchet.davbaho.uz,
#                            which is why the admin session cookie is pinned
#                            to /admin (src/lib/auth/session.ts) rather than
#                            being allowed to sit at "/".
#
# The app's own API routes are /api/lot-image and /api/media/[id]; neither
# collides with /api/search.
# ─────────────────────────────────────────────────────────────────────────────
