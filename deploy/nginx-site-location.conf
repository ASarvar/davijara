# The `location /site` block for davijara.uz — on `markaz` (192.168.1.248),
# the machine that actually runs the Next.js service. This is the INNER of two
# nginx hops; the outer one lives on `markazsrv` and has its own, different
# block — see deploy/nginx-edge-site-location.conf. Confirm with `hostname`
# before editing: this file's proxy_pass is wrong for the other box.
#
# NOT a standalone site config — this server's davijara.uz vhost is shared
# with other projects (the domain root, /kadastr, /new, /api/search all belong
# to something else). Replace the existing `location /site { … }` block in
# /etc/nginx/sites-available/<that vhost> with this one, then:
#   nginx -t && systemctl reload nginx
#
# Pairs with basePath: "/site" in next.config.ts. Both must agree — see the
# note in that file for what breaks if they don't.

location /site {
    # No trailing slash and no URI part on proxy_pass, deliberately: that
    # makes nginx forward the ORIGINAL path, /site included. Next is running
    # with basePath "/site" and expects to receive it. Writing
    # `proxy_pass http://127.0.0.1:3001/;` instead would strip the prefix and
    # every request would 404 against a Next server that is looking for it.
    # [::1], not 127.0.0.1 — IPv6 loopback, and that is not a preference.
    #
    # The unit must bind with HOSTNAME=localhost so Next's rewrite-origin check
    # passes (see the long note in deploy/davijara.service). On this box Node
    # resolves `localhost` to ::1, so the server listens on IPv6 loopback ONLY
    # and an IPv4 proxy_pass gets connection-refused. Confirmed with:
    #     ss -ltnp | grep 3001
    #     LISTEN 0 128 [::1]:3001 [::]:*  users:(("next-server (v1",pid=...))
    #
    # Forcing IPv4 with NODE_OPTIONS=--dns-result-order=ipv4first was tried and
    # does NOT move the listener — verified, it still bound IPv6 only. So the
    # proxy follows the app rather than the other way round.
    #
    # Still loopback, so nothing is exposed beyond this host. Re-check the `ss`
    # output above if HOSTNAME or the Node version ever changes.
    proxy_pass http://[::1]:3001;
    proxy_http_version 1.1;

    # Next.js dev/HMR and any future websocket use.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # TLS is terminated by nginx; this is how the app knows the public scheme.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_cache_bypass $http_upgrade;
}
