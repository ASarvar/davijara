# The `location /site` block for davijara.uz.
#
# NOT a standalone site config — this server's davijara.uz vhost is shared
# with other projects (the domain root, /kadastr, /new, /api/search all belong
# to something else). Replace the existing `location /site { … }` block in
# /etc/nginx/sites-available/<that vhost> with this one, then:
#   nginx -t && systemctl reload nginx
#
# Pairs with basePath: "/site" in next.config.ts. Both must agree — see the
# note in that file for what breaks if they don't.

location /site {
    # No trailing slash and no URI part on proxy_pass, deliberately: that
    # makes nginx forward the ORIGINAL path, /site included. Next is running
    # with basePath "/site" and expects to receive it. Writing
    # `proxy_pass http://127.0.0.1:3001/;` instead would strip the prefix and
    # every request would 404 against a Next server that is looking for it.
    # The unit binds with HOSTNAME=localhost (it has to — see the long note in
    # deploy/davijara.service). On a standard Linux /etc/hosts that resolves to
    # 127.0.0.1 and this line is correct. If the box ever prefers IPv6, Next
    # will bind ::1 only and this becomes a connection-refused; confirm with
    #     ss -ltnp | grep 3001
    # and switch this to http://[::1]:3001 if that is what it shows.
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # Next.js dev/HMR and any future websocket use.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # TLS is terminated by nginx; this is how the app knows the public scheme.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_cache_bypass $http_upgrade;
}
