# Which hosts on 84.54.82.173 the WORLD may reach, and which stay Uzbekistan-only.
# For `markazsrv` (the edge, nginx/1.14.0 Ubuntu) — never `markaz`.
#
# WHY THIS FILE EXISTS (20.11.2026)
#
# Every site on this box shares one public IP and one port 443: davijara.uz,
# online-ijara.uz and its APIs, api/api2/itest/logs/xatlov.davijara.uz. Kerio
# sees only IP:port, so the only place that can tell davijara.uz from
# online-ijara.uz is this nginx. After the Brazilian connection flood of
# 16.10.2026 Kerio's GeoIP filter ended up admitting Uzbekistan only, which
# closed davijara.uz to every foreign citizen and investor — and, since Let's
# Encrypt validates from abroad, stopped certificate renewal (davijara.uz,
# online-ijara.uz and api.online-ijara.uz expire 26.11.2026).
#
# The split this file makes:
#   davijara.uz          open to the world, except /admin
#   everything else      Uzbekistan + office LAN + Google/Yandex crawlers only
#   /.well-known/acme-challenge/   open everywhere, so certificates renew
#
# ORDER OF ROLL-OUT — IT MATTERS
#
#  1. Kerio must stop source-NATing inbound traffic first. While every visitor
#     arrives as 192.168.1.251 (a private address, so $geo_ok = 1), this file
#     blocks NOBODY. Confirm real addresses in /var/log/nginx/access.log before
#     step 3.
#  2. Install this file and the `if` lines below; nginx -t && systemctl reload nginx.
#  3. Only then relax Kerio's GeoIP filter (keep Brazil and Blocked-scrapers).
#
# INSTALL
#
#   mkdir -p /etc/nginx/geo
#   cp deploy/geo/uz-ipv4.conf deploy/geo/crawlers.conf /etc/nginx/geo/
#   cp deploy/nginx-edge-geo.conf /etc/nginx/conf.d/geo.conf
#
# conf.d/*.conf is included inside `http {}` by Ubuntu's stock nginx.conf, which
# is where geo, map and limit_req_zone must live.

# 1 = may reach the Uzbekistan-only hosts.
geo $geo_ok {
    default 0;

    # Loopback and the office / server LANs (also Kerio hairpin traffic).
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;

    include /etc/nginx/geo/uz-ipv4.conf;
    include /etc/nginx/geo/crawlers.conf;
}

# Let's Encrypt validates HTTP-01 from several countries; never block it.
map $uri $is_acme {
    ~^/\.well-known/acme-challenge/  1;
    default                          0;
}

# For the Uzbekistan-only hosts: 1 = refuse.
map "$geo_ok$is_acme" $geo_block {
    "00"     1;
    default  0;
}

# For davijara.uz: only the admin panel stays Uzbekistan-only.
map $uri $is_admin {
    ~^/admin(/|$)  1;
    default        0;
}
map "$geo_ok$is_admin" $davijara_block {
    "01"     1;
    default  0;
}

# Per-IP request limit for FOREIGN addresses only. An empty key is never
# limited, so Uzbek visitors — many of them behind mobile carrier-grade NAT,
# hundreds to one address — are untouched; a foreign flood like the one from
# AS52898 on 16.10.2026 is held to 20 r/s per address. Kerio's 100-per-source
# concurrent cap stays as the second layer.
map $geo_ok $foreign_key {
    1        "";
    default  $binary_remote_addr;
}
limit_req_zone $foreign_key zone=foreign:10m rate=20r/s;
limit_req_status 429;

# ─────────────────────────────────────────────────────────────────────────────
# PER SERVER BLOCK (in /etc/nginx/sites-enabled/*) — add at server level,
# directly under server_name:
#
#   davijara.uz www.davijara.uz (the 443 block):
#       if ($davijara_block) { return 404; }
#       limit_req zone=foreign burst=100 nodelay;
#
#   online-ijara.uz, api.online-ijara.uz, api1.online-ijara.uz,
#   api.davijara.uz, api2.davijara.uz, itest.davijara.uz, logs.davijara.uz,
#   xatlov.davijara.uz, obyekt.uz, e-imzo.uz, eimzo.uz and both `_` default
#   servers — every port-80 and port-443 block of each:
#       if ($geo_block) { return 403; }
#
# A host not on either list stays open to the world the moment Kerio opens.
# Re-run `nginx -T | grep server_name` after adding any new site.
# ─────────────────────────────────────────────────────────────────────────────
