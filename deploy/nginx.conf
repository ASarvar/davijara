# nginx site config for davijara.uz.
# Install as /etc/nginx/sites-available/davijara.uz, then:
#   ln -s /etc/nginx/sites-available/davijara.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Run certbot AFTER this file is enabled with plain HTTP working — it edits
# this file in place to add the cert directives and the 443 block:
#   certbot --nginx -d davijara.uz -d www.davijara.uz

server {
    listen 80;
    listen [::]:80;
    server_name davijara.uz www.davijara.uz;

    # certbot's ACME HTTP-01 challenge needs to reach this over plain HTTP;
    # certbot will insert the redirect to 443 below this line itself.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name davijara.uz www.davijara.uz;

    # ssl_certificate / ssl_certificate_key are added here by certbot.

    # Everything proxies straight through to Node — including /_next/static.
    #
    # Next already serves its own static chunks with correct long-lived
    # immutable Cache-Control headers, and app.headers() in next.config.ts is
    # what attaches the CSP / HSTS / X-Frame-Options on every response. Having
    # nginx read static files off disk directly would skip that path for
    # those specific requests — a small performance win not worth the
    # inconsistency on a government portal's security headers. Revisit only
    # if the app server genuinely becomes the bottleneck.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NEXT_PUBLIC_SITE_URL must be https://davijara.uz — this is what
        # tells the app it is being served over TLS despite nginx doing the
        # actual termination.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache_bypass $http_upgrade;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
}
