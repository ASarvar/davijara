# The `location /site` block for the PUBLIC-FACING server — not for `markaz`.
#
# There are two nginx hops in front of this app, which is easy to miss:
#
#   browser ──https──> `markazsrv`    (edge; terminates TLS, nginx/1.14.0 Ubuntu)
#                          │  http    davijara.uz resolves to 84.54.82.173
#                          ▼
#                      192.168.1.248  (`markaz`, nginx/1.14.2 Debian)
#                          │  http
#                          ▼
#                      [::1]:3001     (Next.js, basePath "/site")
#
# Check `hostname` before editing anything — the two boxes have near-identical
# prompts (`root@markaz` vs `root@markazsrv`) and opposite correct answers for
# proxy_pass. Reloading nginx on the wrong one looks like the fix silently
# failing. The Server header on a response tells you which one answered:
# 1.14.2 is markaz, 1.14.0 (Ubuntu) is the edge.
#
# `deploy/nginx-site-location.conf` is the SECOND hop and is already in place —
# `curl -H "Host: davijara.uz" http://127.0.0.1/site/uz` on markaz returns 200.
# This file is the FIRST hop, and without it the edge has no route for /site and
# answers 502, which is exactly what davijara.uz/site was doing.
#
# Install into the davijara.uz server block on 84.54.82.173 (the one with the
# TLS certificate), then: nginx -t && systemctl reload nginx

location /site {
    # Straight to markaz on port 80 — its own nginx owns the /site -> :3001
    # step, so this hop only has to get the request onto that machine.
    #
    # NO PORT HERE. Writing `http://192.168.1.248:3001` is the obvious guess
    # and it cannot work: markaz's Next binds [::1]:3001, its own loopback,
    # which nothing outside that machine can reach. Done for real, and it
    # produced a 502 with this in the edge's error log:
    #     connect() failed (111: Connection refused) while connecting to
    #     upstream, upstream: "http://192.168.1.248:3001/site/uz"
    # Port 80 is markaz's nginx, and that is the only door open to us.
    #
    # No trailing slash and no URI part, same reason as the inner block: the
    # path must arrive with /site intact, because Next is running under
    # basePath "/site" and matches on it.
    proxy_pass http://192.168.1.248;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    # Must stay the PUBLIC host. The app builds canonical URLs, hreflang links
    # and locale cookies from it — forwarding markaz's own address here would
    # publish internal hostnames into the page.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # TLS is terminated HERE, at the edge. This is the only hop that knows the
    # request was https, so it is the one that has to say so.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Image uploads in the admin panel — see the fuller note in
    # nginx-site-location.conf.
    #
    # This is the OUTERMOST gate: a request too large for the edge never
    # reaches markaz at all, so setting it only on the inner nginx would
    # leave uploads failing with a 413 that no application log explains.
    # Both hops must carry it, and both must be at least as large as
    # serverActions.bodySizeLimit in next.config.ts.
    client_max_body_size 8m;

    proxy_cache_bypass $http_upgrade;
}
